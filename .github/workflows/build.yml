
 name: Build API JSON
 on:
   push:
     branches: [main]

 jobs:
   build:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v3
       - uses: oven-sh/setup-bun@v1

       # Build api.json WITHOUT Cloudflare
       - name: Install dependencies
         run: bun install

       - name: Build api.json
         run: |
           cd packages/web
           bun run ./script/build.ts

       - name: Copy api.json to root
         run: cp packages/web/dist/api.json ./api.json

       - name: Commit api.json
         run: |
           git config --global user.name 'GitHub Action'
           git config --global user.email 'action@github.com'
           git add api.json
           git diff --quiet && git diff --staged --quiet || git commit -m "Build api.json"
           git push

