name: Automated Provider Sync

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual triggering
  push:
    branches: [ dev, main ]
    paths:
      - 'sync_manager.py'
      - 'sync_*.py'
      - 'providers/**'

jobs:
  sync-providers:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for git operations
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tomli tomli-w aiohttp
    
    - name: Run sync with validation
      run: |
        echo "🔄 Starting automated sync..."
        python sync_manager.py --status
        python sync_manager.py
        
        # Validate configurations
        if command -v bun > /dev/null 2>&1; then
          bun validate
        else
          echo "⚠️ Bun not available, skipping validation"
        fi
    
    - name: Commit and push if changes
      run: |
        if git diff --quiet; then
          echo "✅ No changes to commit"
        else
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add providers/
          git commit -m "chore: automated provider sync $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "✅ Changes committed and pushed"
        fi
    
    - name: Generate sync report
      run: |
        echo "📊 Sync Report" > sync_report.md
        echo "=============" >> sync_report.md
        echo "" >> sync_report.md
        echo "**Sync completed at:** $(date -u)" >> sync_report.md
        echo "" >> sync_report.md
        python sync_manager.py --status >> sync_report.md
        echo "" >> sync_report.md
        echo "**Git Status:**" >> sync_report.md
        git status --short >> sync_report.md
    
    - name: Upload sync report
      uses: actions/upload-artifact@v4
      with:
        name: sync-report
        path: sync_report.md
        retention-days: 7