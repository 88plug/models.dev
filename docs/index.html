<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>models.dev - AI Provider Sync Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 models.dev</h1>
            <p>AI Provider Sync Monitoring Dashboard</p>
        </header>

        <div class="dashboard">
            <div class="stats-overview">
                <div class="stat-card">
                    <h3>Total Providers</h3>
                    <div class="stat-value" id="total-providers">--</div>
                </div>
                <div class="stat-card">
                    <h3>Total Models</h3>
                    <div class="stat-value" id="total-models">--</div>
                </div>
                <div class="stat-card">
                    <h3>Last Sync</h3>
                    <div class="stat-value" id="last-sync">--</div>
                </div>
            </div>

            <div class="providers-grid">
                <div class="section-header">
                    <h2>Provider Status</h2>
                    <button id="refresh-btn" class="refresh-btn">🔄 Refresh</button>
                </div>
                <div id="providers-container" class="providers-container">
                    <!-- Provider cards will be populated here -->
                </div>
            </div>

            <div class="charts-section">
                <div class="section-header">
                    <h2>Models Distribution</h2>
                </div>
                <div class="chart-container">
                    <canvas id="models-chart"></canvas>
                </div>
            </div>

            <div class="sync-history">
                <div class="section-header">
                    <h2>Recent Sync Activity</h2>
                </div>
                <div id="sync-history" class="history-list">
                    <!-- Sync history will be populated here -->
                </div>
            </div>
        </div>

        <footer>
            <p>Last updated: <span id="last-updated">--</span></p>
            <p>Generated by GitHub Actions • <a href="https://github.com/yourusername/models.dev">View Repository</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
